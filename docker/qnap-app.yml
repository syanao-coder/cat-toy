# QNAP Container Station の「アプリケーション」→「作成」に、このまま貼り付けて使う YAML。
# 書き換えるのは「← 書き換える」の 2 行だけ（ESP32 の IP アドレスと合言葉）。
# 検出モデルはイメージに入っているので、ほかに用意するものはない。
# CPU・メモリの上限は YAML に書くと受け付けられないので、作成画面の「詳細設定 → リソース」で設定する（任意）。

services:
  cattoy:
    image: ghcr.io/syanao-coder/cat-toy:gpu    # GPU を使わないなら :cpu
    container_name: cattoy
    restart: unless-stopped
    ports:
      - "8090:8080"                            # 操作画面 → http://<NAS の IP>:8090/
    volumes:
      - /share/Container/cattoy:/data          # 位置合わせの結果・遊んだ記録などの保存先（なければ作られる）
    environment:
      - CATTOY_ESP32_HOST=192.168.1.50         # ← 書き換える: ESP32 の IP アドレス
      - CATTOY_ESP32_KEY=change-me             # ← 書き換える: secrets.h の CATTOY_KEY と同じ合言葉
      - TZ=Asia/Tokyo
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:                             # GPU を使わないなら deploy: から下の 7 行を消す
            - driver: nvidia
              count: all
              capabilities: [gpu]
