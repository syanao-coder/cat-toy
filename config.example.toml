# cat-toy 設定ファイルの例。config.toml にコピーして使う:  cp config.example.toml config.toml
# 書いていない項目は既定値になる（既定値と説明は cattoy/config.py を参照）。
# 座標は画像の幅・高さを 1 とした値（左上が [0, 0]、右下が [1, 1]）。

[camera]
backend = "picamera2"   # Raspberry Pi カメラ。USB カメラなら "opencv"
width = 640
height = 480            # Camera Module 3 は横長（16:9）なので 640x360 にすると横の画角を最大限使える
hflip = false
vflip = false

[detector]
model_path = "models/yolo11n.onnx"
input_size = 320        # 小さいほど速い（320 で Pi 5 なら 10fps 前後）
conf_threshold = 0.35

[servo]
backend = "pca9685"     # "pca9685"（推奨） / "gpio"（GPIO 直結） / "mock"（実機なし）
pan_channel = 0
tilt_channel = 1
# 可動範囲（度）。`cattoy hw-test --laser` で確認し、床の遊ばせたい範囲だけを照らすように狭める。
# 窓・テレビ・人の顔の高さに届かない範囲にしておくこと。
pan_min = 40
pan_max = 140
tilt_min = 40
tilt_max = 120
pan_home = 90
tilt_home = 80

[laser]
backend = "gpio"        # "gpio" / "mock"
gpio = 17               # BCM 番号（物理ピン 11）

[calibration]
path = "calibration.json"
grid = 9

[play]
session_max_s = 600     # 1 回 10 分まで
cooldown_s = 1800       # その後 30 分休む
active_hours = "07:00-23:00"
person_safety = true    # 人が写っている間は消灯
# 遊ばせる範囲（多角形）。空ならキャリブレーションで点が写った範囲を自動で使う。
# `cattoy run --web 8080` のプレビュー画面をクリックすると座標が得られる。
# play_area = [[0.1, 0.4], [0.9, 0.4], [0.95, 0.95], [0.05, 0.95]]
# 終わりにレーザーを誘導する場所（おもちゃ・おやつを置いておくと「捕まえた」で終われる）
# finish_point = [0.5, 0.8]

[runtime]
control_hz = 50
web_port = 0            # 0 ならプレビュー無効。常時見たいなら 8080 など
