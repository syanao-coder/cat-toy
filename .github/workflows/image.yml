# テストを実行し、コンテナイメージを作って GitHub Container Registry（ghcr.io）に置く。
#   main に入ったとき: ghcr.io/<owner>/cat-toy:gpu と :cpu を更新する（NAS はこれを取ってくる）
#   プルリクエスト:   テストとイメージのビルドだけ行う（置かない）
name: test-and-image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -q

  # ESP32 のファームウェアがコンパイルできることを確かめる（書き込みは各自の PC から）
  firmware:
    runs-on: ubuntu-latest
    env:
      ESP32_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
      ESP32_CORE: esp32:esp32@3.2.0
      FQBN: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-${{ env.ESP32_CORE }}
      - name: esp32 ボードパッケージを入れる
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_URL"
          arduino-cli core install "$ESP32_CORE" --additional-urls "$ESP32_URL"
      - name: コンパイル（secrets.h は見本をそのまま使う）
        run: |
          cp firmware/cattoy_esp32/secrets.example.h firmware/cattoy_esp32/secrets.h
          arduino-cli compile --fqbn "$FQBN" --warnings default firmware/cattoy_esp32

  image:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [gpu, cpu]
    steps:
      - uses: actions/checkout@v4
      - name: ディスクの空きを作る（GPU 版のイメージは大きい）
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.variant }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.name.outputs.image }}:${{ matrix.variant }}
            ${{ steps.name.outputs.image }}:${{ matrix.variant }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
