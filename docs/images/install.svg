<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'Hiragino Sans', 'Yu Gothic', Meiryo, 'Noto Sans CJK JP', 'IPAGothic', sans-serif">
<rect width="900" height="560" fill="#ffffff"/>
<text x="30" y="36" font-size="20" text-anchor="start" fill="#212121" font-weight="bold">設置のしかた</text>
<text x="30" y="60" font-size="13" text-anchor="start" fill="#616161" font-weight="normal">高い壁面（部屋の角が理想）から、部屋の中央に向けて斜め下に取り付ける</text>
<rect x="60" y="80" width="26" height="330" fill="#d7ccc8"/>
<path d="M60,98 l26,-12" stroke="#a1887f" stroke-width="2"/>
