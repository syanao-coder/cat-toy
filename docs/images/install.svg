<path d="M60,386 l26,-12" stroke="#a1887f" stroke-width="2"/>
<path d="M60,404 l26,-12" stroke="#a1887f" stroke-width="2"/>
<rect x="60" y="410" width="800" height="18" fill="#bcaaa4"/>
<text x="300" y="450" font-size="14" text-anchor="middle" fill="#212121" font-weight="bold">床（ここで遊ぶ）</text>
<path d="M118,124 L420,410 L860,410 L860,230 Z" fill="#4fc3f7" fill-opacity="0.18" stroke="#4fc3f7" stroke-width="2" stroke-dasharray="6 5"/>
<text x="700" y="300" font-size="13" text-anchor="middle" fill="#0288d1" font-weight="normal">カメラの見える範囲</text>
<path d="M86,104 h40 l14,36 h-54 z" fill="#455a64" stroke="#263238" stroke-width="2"/>
<circle cx="120" cy="128" r="7" fill="#4fc3f7" stroke="#263238" stroke-width="2"/>
<text x="150" y="108" font-size="14" text-anchor="start" fill="#212121" font-weight="bold">ケース</text>
<text x="150" y="128" font-size="12" text-anchor="start" fill="#616161" font-weight="normal">斜め下向き（部屋の中央へ）</text>
<path d="M40,122 V408 M32,122 h16 M32,408 h16" stroke="#616161" stroke-width="2"/>
<text x="18" y="262" font-size="13" text-anchor="middle" fill="#616161" font-weight="bold">2m</text>
<text x="18" y="280" font-size="13" text-anchor="middle" fill="#616161" font-weight="bold">以上</text>
<path d="M126,134 L560,404" stroke="#d32f2f" stroke-width="2.5" stroke-dasharray="8 5"/>
<circle cx="560" cy="404" r="6" fill="#d32f2f"/>
<text x="560" y="448" font-size="12" text-anchor="middle" fill="#d32f2f" font-weight="bold">レーザーの点</text>
<ellipse cx="660" cy="388" rx="46" ry="20" fill="#ff8a65"/>
<circle cx="616" cy="366" r="16" fill="#ff8a65"/>
<path d="M604,356 l2,-16 l10,10 z M618,352 l8,-14 l4,14 z" fill="#ff8a65"/>
<path d="M704,384 q30,-10 26,-40" fill="none" stroke="#ff8a65" stroke-width="7" stroke-linecap="round"/>
<circle cx="611" cy="363" r="2.5" fill="#212121"/>
<text x="700" y="448" font-size="12" text-anchor="middle" fill="#bf360c" font-weight="normal">猫の少し前を照らす</text>
<text x="60" y="490" font-size="13" text-anchor="start" fill="#424242" font-weight="normal">・真下に向けない（真下付近はパンの回転が効かず、狙いが不安定になる）</text>
<text x="60" y="512" font-size="13" text-anchor="start" fill="#424242" font-weight="normal">・鏡・窓・テレビ・ガラスに光が当たらない向きに</text>
<text x="60" y="534" font-size="13" text-anchor="start" fill="#424242" font-weight="normal">・猫が登って届く所、ケーブルをかじれる所は避ける</text>
</svg>
