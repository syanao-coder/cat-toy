<path d="M60,188 l26,-12" stroke="#a1887f" stroke-width="2"/>
<path d="M60,206 l26,-12" stroke="#a1887f" stroke-width="2"/>
<path d="M60,224 l26,-12" stroke="#a1887f" stroke-width="2"/>
<path d="M60,242 l26,-12" stroke="#a1887f" stroke-width="2"/>
